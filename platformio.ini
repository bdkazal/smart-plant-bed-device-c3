[platformio]
default_envs = esp32c3_supermini

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

; ESP32-C3 native USB serial monitor support.
; Without these flags, upload may succeed but Serial output can stay blank.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFIRMWARE_VERSION=\"smart-plant-bed-c3-m13-0.6\"

lib_deps =
    bblanchon/ArduinoJson
    adafruit/DHT sensor library
    adafruit/RTClib
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
